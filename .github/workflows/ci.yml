name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # After the build: the route tree (src/routeTree.gen.ts) is generated
      # by it and isn't committed.
      - name: Type-check
        run: bun run typecheck

  # Builds a fresh database from supabase/migrations alone, then loads
  # supabase/seed.sql, so a migration that can't replay from scratch or a
  # broken seed fails here (staging and local setup depend on both). Then
  # checks the committed generated types match the migrations.
  schema:
    runs-on: ubuntu-latest
    steps:
      # Linux hands out local ports for outgoing connections from 32768-60999,
      # which covers Supabase's 54321-54329. An image pull that happens to use
      # 54322 makes `db start` fail with "address already in use", and the
      # port stays taken for ~60s in TIME_WAIT (CRU-63). Keep outgoing ports
      # below the stack's. Runs first, before checkout opens a connection.
      - name: Keep outgoing ports clear of the local stack
        run: sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build a database from the migrations
        run: |
          bunx supabase@2.120.0 db start || {
            echo "::warning::The database failed to start; retrying once (CRU-62)."
            bunx supabase@2.120.0 stop --no-backup
            sleep 5
            bunx supabase@2.120.0 db start
          }

      - name: Generated types match the migrations
        run: |
          bun run db:types
          git diff --exit-code src/integrations/supabase/types.ts || {
            echo "::error::src/integrations/supabase/types.ts is out of date. Run 'bun run db:start && bun run db:types' and commit the result."
            exit 1
          }

  # Runs the CRU-15 adversarial matrix (scripts/adversarial-test-matrix.ts)
  # against a disposable local stack built from the migrations and the seed:
  # two seed students attack each other's data through supabase-js with the
  # anon key, the way a malicious client would. A policy, grant or SECURITY
  # DEFINER change that opens a hole fails here, before it reaches production.
  security:
    runs-on: ubuntu-latest
    steps:
      # See the schema job (CRU-63).
      - name: Keep outgoing ports clear of the local stack
        run: sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start the local stack (migrations + seed)
        # Fallback for any other start-up flake (CRU-62); the port collision
        # itself is prevented by the step above (CRU-63).
        run: |
          bun run db:start || {
            echo "::warning::The local stack failed to start; retrying once."
            bunx supabase@2.120.0 stop --no-backup
            sleep 5
            bun run db:start
          }

      # Supabase grants anon/authenticated ALL on new tables by default; a
      # migration that forgets its REVOKE shows up here (CRU-56).
      - name: API-role grants match supabase/grants.txt
        run: bun run db:grants

      - name: Point the test at it
        run: bun run db:env

      - name: Adversarial test matrix
        run: bun run test:security

  # Smoke tests (CRU-57): a production build (Node server preset, strict
  # nonce CSP) against the local stack and the seed. Fails if a page throws,
  # logs a console error (a CSP violation does), or a core flow breaks.
  e2e:
    runs-on: ubuntu-latest
    steps:
      # See the schema job (CRU-63).
      - name: Keep outgoing ports clear of the local stack
        run: sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start the local stack (migrations + seed)
        # Fallback for any other start-up flake (CRU-62); the port collision
        # itself is prevented by the step above (CRU-63).
        run: |
          bun run db:start || {
            echo "::warning::The local stack failed to start; retrying once."
            bunx supabase@2.120.0 stop --no-backup
            sleep 5
            bun run db:start
          }

      - name: Point the app at it
        run: bun run db:env

      - name: Smoke tests
        run: bun run test:e2e

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
