name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # After the build: the route tree (src/routeTree.gen.ts) is generated
      # by it and isn't committed.
      - name: Type-check
        run: bun run typecheck

  # Builds a fresh database from supabase/migrations alone, then loads
  # supabase/seed.sql, so a migration that can't replay from scratch or a
  # broken seed fails here (staging and local setup depend on both). Then
  # checks the committed generated types match the migrations.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build a database from the migrations
        run: bunx supabase@2.120.0 db start

      - name: Generated types match the migrations
        run: |
          bun run db:types
          git diff --exit-code src/integrations/supabase/types.ts || {
            echo "::error::src/integrations/supabase/types.ts is out of date. Run 'bun run db:start && bun run db:types' and commit the result."
            exit 1
          }

  # Runs the CRU-15 adversarial matrix (scripts/adversarial-test-matrix.ts)
  # against a disposable local stack built from the migrations and the seed:
  # two seed students attack each other's data through supabase-js with the
  # anon key, the way a malicious client would. A policy, grant or SECURITY
  # DEFINER change that opens a hole fails here, before it reaches production.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start the local stack (migrations + seed)
        run: bun run db:start

      - name: Point the test at it
        run: bun run db:env

      - name: Adversarial test matrix
        run: bun run test:security
